# /etc/nginx/sites-available/default
# Nginx + Zabbix agent 2: stub_status для сбора метрик

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;
    server_name _;

    # Статус Nginx только с localhost (используется Zabbix agent 2)
    location = /basic_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
